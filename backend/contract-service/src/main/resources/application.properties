spring.application.name=contract-service
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contract_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQLSERVER_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true